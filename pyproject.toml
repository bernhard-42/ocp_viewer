[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp_viewer"
version = "1.1.2"
authors = [{ name = "Bernhard Walter", email = "b_walter@arcor.de" }]
description = "The standalone OCP CAD viewer"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["3d", "brep", "cad", "cadquery", "build123d", "viewer"]
license = "Apache-2.0"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

# One dependency that is ours. Everything the viewer decides - the show
# pipeline, the config semantics, the measurement backend, the port registry
# and the protocol - is ocp-viewer-core's, so what is left here is a websocket
# server that also hands out one page, and the command line in front of it.
# `websockets` is both halves: the client the core speaks through, and the
# threaded server here.
dependencies = [
    # `[cli]`: this host runs from a plain shell, where choosing between
    # several viewers is questionary's prompt rather than `input()`.
    "ocp-viewer-core[cli]>=1.0.8,<1.1.0",
    "click>=8.1,<9.0",
    "orjson",
    "PyYAML",
    "websockets>=16.0",
]

[project.urls]
"Homepage" = "https://github.com/bernhard-42/ocp_viewer"
"Bug Tracker" = "https://github.com/bernhard-42/ocp_viewer/issues"

[project.scripts]
ocp-viewer = "ocp_viewer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocp_viewer*"]

[tool.setuptools.package-data]
ocp_viewer = [
    "server/templates/*.html",
    "server/static/js/*.js",
    "server/static/js/ocp-viewer-core/*.js",
    "server/static/css/*.css",
    "server/static/icon/*",
]

# ruff and ty are the whole toolchain, as in ocp-viewer-core: `ruff check`
# lints, `ty check` types, and nothing reformats.

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.bumpversion]
current_version = "1.1.2"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "ocp_viewer/_version.py"
