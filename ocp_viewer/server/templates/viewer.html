<!-- The standalone viewer's page, rendered by Flask. Its placeholders are
     Jinja's and are resolved where every other Jinja template's are - an HTML
     comment is no shelter from that, so this sentence says "placeholders"
     rather than showing a pair of empty braces, which Jinja reads as an
     expression and refuses.

     ocp_vscode's webview is a separate page in that project, and is static:
     what it cannot know arrives in a message rather than a template. -->
<html>
    <head>
        <meta charset="utf-8" />
        <title>OCP Viewer</title>
        <link rel="icon" type="image/png" href="static/icon/ocp-eye.png" />
        <link rel="stylesheet" href="./static/css/three-cad-viewer.css" />
        <script type="module" src="static/js/three-cad-viewer.esm.js"></script>
        <script type="module" srv="static/js/comms.js"></script>
        <script type="module">
            import { Viewer, Display, Timer } from "./static/js/three-cad-viewer.esm.js";
            import { createPage } from "./static/js/ocp-viewer-core/index.js";
            import { Comms } from "./static/js/comms.js";

            // The page is ocp-viewer-core's, the same one ocp_vscode's webview
            // builds. What is left here is how this host starts: the settings
            // are rendered into the template by Flask, and the channel to
            // Python is a websocket back to the server that served this page.
            const comms = new Comms("{{ ws_host }}", {{ ws_port }}, {{ max_retries }});

            function send(command, message) {
                comms.sendStatus({ command: command, text: message });
            }

            const settings = {
                theme: "{{ theme }}",
                treeWidth: JSON.parse("{{ treeWidth }}"), // make linter happy
                glass: JSON.parse("{{ glass|tojson }}"), // make linter happy
                tools: JSON.parse("{{ tools|tojson }}"), // make linter happy
                up: "{{ up }}",
                control: "{{ control }}",
                // The Display reads the keymap in its constructor, so it has to
                // be here at splash: this host builds its Display once, when
                // the page loads, and every later show recomputed the keymap
                // and threw it away. `modifier_keys` in ~/.ocpvscode_standalone
                // therefore never applied at all, compat shim for the missing
                // alt key and all.
                keymap: JSON.parse("{{ modifier_keys|tojson }}")
            };

            const page = createPage({
                Viewer,
                Display,
                Timer,
                send,
                theme: settings.theme,
                overrides: {
                    display: {
                        treeWidth: settings.treeWidth,
                        glass: settings.glass,
                        tools: settings.tools,
                        theme: settings.theme,
                        zscaleTool: false
                    },
                    viewer: {
                        tools: settings.tools,
                        glass: settings.glass,
                        up: settings.up,
                        control: settings.control
                    }
                }
            });

            // Shown on load rather than when told to: nothing is going to send
            // this host a splash, because it is the server.
            window.showViewer = () =>
                page.showSplash({
                    theme: settings.theme,
                    treeWidth: settings.treeWidth,
                    keymap: settings.keymap
                });
        </script>
    </head>

    <body style="padding: 0px; width: fit-content" onload="showViewer()">
        <div id="cad_viewer"></div>
    </body>
</html>
